<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A&Z FOOD Admin</title><style>body{margin:0;background:#080808;color:#fff;font-family:Arial}.box{max-width:1200px;margin:auto;padding:30px 5%}.login{max-width:380px;margin:12vh auto;background:#151515;padding:25px;border-radius:14px}.login input,.login button{width:100%;padding:13px;margin-top:9px}.login button{background:#ffb400;border:0;font-weight:bold}.hide{display:none}table{width:100%;border-collapse:collapse;background:#111}th,td{padding:11px;border-bottom:1px solid #292929;text-align:left;vertical-align:top}select{padding:7px}</style></head><body><div class="box"><h1>A&Z FOOD — Administration</h1><div id="login" class="login"><input id="pw" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="err"></p></div><div id="app" class="hide"><button onclick="location.reload()">Actualiser</button><div style="overflow:auto"><table><thead><tr><th>#</th><th>Client</th><th>Articles</th><th>Total</th><th>Paiement</th><th>Statut</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok){loginBox=document.getElementById('login');loginBox.className='hide';app.className='';load()}else err.textContent='Mot de passe incorrect.'}async function load(){let r=await fetch('/api/admin/orders');if(!r.ok)return;let d=await r.json();rows.innerHTML=d.map(o=>`<tr><td>#${o.id}</td><td><b>${o.customer_name}</b><br>${o.phone}<br>${o.address}<br>${o.notes||''}</td><td>${o.items.map(i=>`${i.qty}× ${i.name}${i.supplements.length?'<br>+ '+i.supplements.join(', '):''}`).join('<br>')}</td><td>${(o.total_cents/100).toFixed(2)} €</td><td>${o.payment_method}</td><td><select onchange="st(${o.id},this.value)">${['new','confirmed','preparing','out_for_delivery','delivered','cancelled'].map(s=>`<option ${s==o.order_status?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(o.created_at+'Z').toLocaleString('fr-FR')}</td></tr>`).join('')}async function st(id,status){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}</script></body></html>
